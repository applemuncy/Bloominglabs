WSGIScriptAlias / /home/pi/Bloominglabs/web_admin/django_app/wsgi.py
WSGIPythonHome /home/pi/venv
WSGIPythonPath /home/pi/Bloominglabs/web_admin/

<Directory /home/pi/Bloominglabs/web_admin/>
<Files wsgi.py>
Require all granted
</Files>
</Directory>

Alias /static /home/pi/Bloominglabs/web_admin/static

<VirtualHost *:80>
	# The ServerName directive sets the request scheme, hostname and port that
	# the server uses to identify itself. This is used when creating
	# redirection URLs. In the context of virtual hosts, the ServerName
	# specifies what hostname must appear in the request's Host: header to
	# match this virtual host. For the default virtual host (this file) this
	# value is not decisive as it is used as a last resort host regardless.
	# However, you must set it for any further virtual host explicitly.
	ServerName DMS.local

	ServerAdmin webmaster@localhost
	DocumentRoot /home/pi/Bloominglabs/web_admin/
	Alias /static /home/pi/Bloominglabs/web_admin/static/
	Alias /media /home/pi/Bloominglabs/web_admin/media/


	<Directory /home/pi/Bloominglabs/web_admin>
	Require all granted
	</Directory>

	<Directory /home/pi/Bloominglabs/web_admin/admin>
	Require all granted
	</Directory>

	<Directory /home/pi/Bloominglabs/web_admin/static/admin>
	Require all granted
	</directory>

	<Directory /home/pi/Bloominglabs/web_admin/static>
	Require all granted
	</Directory>

	<Directory /home/pi/Bloominglabs/web_admin/templates>
	Require all granted
	</Directory>

	<Directory /home/pi/Bloominglabs/web_admin/media>
	Require all granted
	</Directory>

	<Directory /home/pi/Bloominglabs/wed_admin/templates>
	Require all granted
	</Directory>





	# Available loglevels: trace8, ..., trace1, debug, info, notice, warn,
	# error, crit, alert, emerg.
	# It is also possible to configure the loglevel for particular
	# modules, e.g.
	#LogLevel info ssl:warn

	ErrorLog ${APACHE_LOG_DIR}/error.log
	CustomLog ${APACHE_LOG_DIR}/access.log combined

	# For most configuration files from conf-available/, which are
	# enabled or disabled at a global level, it is possible to
